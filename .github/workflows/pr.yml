name: Run tests on PR to main

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/database/**"
      - "apps/ask-gateway/**"
      - "apps/engine/**"
      - ".github/workflows/pr.yml"
    branches:
      - main

jobs:
  TestBuild:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Test build
        working-directory: apps/web
        run: npm run build

  ImportAndPlannerTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependencies
        working-directory: apps/database
        run: bun install --frozen-lockfile
      - name: Test import failure propagation
        working-directory: apps/database
        run: bun test src/scripts/supabase/tests/import.test.ts
      - name: Install gateway test dependencies
        run: python -m pip install -r apps/ask-gateway/requirements.txt
      - name: Test Ask AI planner and gateway
        working-directory: apps/ask-gateway
        run: python -m pytest tests -q
