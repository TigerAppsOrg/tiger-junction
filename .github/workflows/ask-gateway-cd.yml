name: Ask Gateway CD

on:
  push:
    paths:
      - "apps/ask-gateway/**"
      - ".github/workflows/ask-gateway-cd.yml"
    branches:
      - main

concurrency:
  group: ask-gateway-deploy-${{ github.ref }}

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Python on the EC2 host running the service
          python-version: "3.9"

      - name: Install dependencies
        working-directory: apps/ask-gateway
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/ask-gateway
        run: python -m pytest tests/ -q

  Deploy:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/junction-engine.pem
          chmod 600 ~/.ssh/junction-engine.pem
          ssh-keyscan -H 52.45.218.243 >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            apps/ask-gateway/ ec2-user@52.45.218.243:/opt/ask-gateway/ \
            -e "ssh -i ~/.ssh/junction-engine.pem"

      - name: Restart and verify
        run: |
          ssh -i ~/.ssh/junction-engine.pem ec2-user@52.45.218.243 << 'EOF'
            set -e
            cd /opt/ask-gateway
            python3 -m pip install --user -q -r requirements.txt
            sudo systemctl restart ask-gateway
            sleep 3
            systemctl is-active ask-gateway
            curl -fsS http://127.0.0.1:8010/health
          EOF
