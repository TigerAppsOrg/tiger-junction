name: Seats Cron

on:
  schedule:
    # Hourly at :00 (GitHub Actions scheduling is best-effort; real delay can be 5-15 min under load).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      term:
        description: "Term code (e.g. 1274 for Spring 2027)"
        required: true
        default: "1274"
      import_courses:
        description: "Import full listings, courses, grading and sections before refreshing seats (new semester)"
        type: boolean
        required: false
        default: false

concurrency:
  group: seats-cron
  cancel-in-progress: false

jobs:
  update-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.SERVICE_KEY }}
      API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
      CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
      CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: apps/database
        run: bun install --frozen-lockfile

      - name: Import listings, courses and grading + sync Redis
        if: ${{ inputs.import_courses }}
        working-directory: apps/database
        env:
          TERM: ${{ inputs.term || '1274' }}
        run: bun run update-supabase "$TERM" --grading

      - name: Update seats + sync Redis
        working-directory: apps/database
        env:
          TERM: ${{ inputs.term || '1274' }}
        run: bun run update:seats:once "$TERM"
